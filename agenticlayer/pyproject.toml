[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-layer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.28,<1", "uvicorn>=0.34,<1"]

[project.entry-points."sglang.srt.plugins"]
agentic_layer = "agentic_layer.sglang_plugin:register"

[tool.setuptools.packages.find]
include = ["agentic_layer*"]
